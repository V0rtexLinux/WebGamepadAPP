name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify Gradle wrapper jar integrity
      id: wrapper_check
      run: |
        if [ ! -s gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
          echo "corrupted=true" >> "$GITHUB_OUTPUT"
        else
          echo "corrupted=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Regenerate Gradle wrapper
      if: steps.wrapper_check.outputs.corrupted == 'true'
      run: |
        echo "gradle-wrapper.jar corrompido ou ausente — regenerando..."
        gradle wrapper --gradle-version 8.6 --distribution-type all
        chmod +x gradlew

    - name: Commit regenerated wrapper
      if: steps.wrapper_check.outputs.corrupted == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
        git commit -m "ci: auto-fix corrupted gradle-wrapper.jar" || echo "Nada para commitar"
        git push || echo "Push falhou (provavelmente PR de fork, sem permissão)"

    - name: Build with Gradle
      run: ./gradlew build

    - name: Run Kotlin lint checks
      run: ./gradlew ktlintCheck detekt --continue
      continue-on-error: true

    - name: Run unit tests
      run: ./gradlew test
