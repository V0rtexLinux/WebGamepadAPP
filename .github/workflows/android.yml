name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Regenerate Gradle wrapper
      run: |
        gradle wrapper --gradle-version 8.6 --distribution-type all
        chmod +x gradlew

    - name: Commit regenerated wrapper (if changed)
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
        git diff --cached --quiet && echo "Wrapper já está atualizado — nada para commitar" || (
          git commit -m "ci: sync gradle wrapper"
          git push
        )
      continue-on-error: true

    - name: Build with Gradle
      run: ./gradlew assembleDebug assembleRelease -x lintDebug -x lintVitalRelease

    - name: Run Kotlin lint checks
      run: ./gradlew ktlintCheck detekt --continue
      continue-on-error: true

    - name: Run unit tests
      run: ./gradlew test

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: |
          app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/release/*.apk
        retention-days: 14
        if-no-files-found: error
